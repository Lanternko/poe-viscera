<meta charset="utf-8">
<title>Wickerman 臟器圖鑑</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500&display=swap">
<style>
/* Design source: AramMeta DESIGN.md + scripts/templates/site.css (aram-winrate-nn).
   Copied: tokens (dark default + light), nfx filter chips, nfx search field, tier-block /
   tier-heading / tier-pill, detail.detail-inline with inline-detail-close / detail-head /
   detail-avatar / inline-detail-actions / detail-cols, augment icon surface.
   New (no AramMeta equivalent): .item tile carrying price + name + place. */
:root{
  color-scheme:dark;
  --bg:#0a0b0d; --surface:#101114; --surface-2:#161a20; --surface-sunken:#0b0d0f; --surface-raised:#1a1d21;
  --chip-bg:#1a1d21; --overlay:#1e2329;
  --text:#e8eaed; --text-muted:#9aa0a6; --text-dim:#6b7280;
  --border:rgba(255,255,255,.09); --border-strong:rgba(255,255,255,.15);
  --accent:#c084fc; --accent-soft:#e2c2ff; --accent-on:#1a0b26;
  --augment-icon-surface:#0b0e13;
  --font-ui:"Noto Sans TC",-apple-system,"Segoe UI","Microsoft JhengHei","PingFang TC",sans-serif;
  --font-caption:"Noto Serif TC","Source Han Serif TC","PingFang TC","PMingLiU","Songti TC",serif;
  --nfx-fg:#e5e5e5; --nfx-strong:#fff; --nfx-line:rgba(229,229,229,.4); --nfx-on-fg:#141414;
  --nfx-search:#2a2a2a; --nfx-search-focus:#141414; --nfx-search-ring:#fff; --nfx-search-icon:#a3a3a3;
  --T1:#ff5a3c; --T2:#f5c518; --T3:#8ec441; --T4:#3aa0ff; --T5:#7a7f8a;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef0f3; --surface-sunken:#eef1f6; --surface-raised:#ffffff;
  --chip-bg:#eceff4; --overlay:#ffffff;
  --text:#1a1e26; --text-muted:#5b6472; --text-dim:#818b99;
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
  --accent:#9d4edd; --accent-soft:#7e22ce; --accent-on:#ffffff;
  --nfx-fg:#1c1d21; --nfx-strong:#000; --nfx-line:rgba(28,29,33,.32); --nfx-on-fg:#fff;
  --nfx-search:#e1e4ea; --nfx-search-focus:#fff; --nfx-search-ring:#1c1d21; --nfx-search-icon:#6b6e75}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef0f3; --surface-sunken:#eef1f6; --surface-raised:#ffffff;
  --chip-bg:#eceff4; --overlay:#ffffff;
  --text:#1a1e26; --text-muted:#5b6472; --text-dim:#818b99;
  --border:rgba(0,0,0,.10); --border-strong:rgba(0,0,0,.16);
  --accent:#9d4edd; --accent-soft:#7e22ce; --accent-on:#ffffff;
  --nfx-fg:#1c1d21; --nfx-strong:#000; --nfx-line:rgba(28,29,33,.32); --nfx-on-fg:#fff;
  --nfx-search:#e1e4ea; --nfx-search-focus:#fff; --nfx-search-ring:#1c1d21; --nfx-search-icon:#6b6e75}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;line-height:1.5}
.wrap{max-width:1320px;margin:0 auto;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));padding-block:24px 64px}
@media (max-width:600px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-variant-numeric:tabular-nums lining-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

h1{margin:0;font-size:22px;font-weight:600;line-height:1.1}
.subtitle{margin-top:6px;color:var(--text-muted);font-size:13px;font-family:var(--font-caption)}

.bar{position:sticky;top:0;z-index:30;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:12px 0;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 10px;font:inherit;font-size:13px;font-weight:500;line-height:1;cursor:pointer;color:var(--nfx-fg);background:transparent;border:1px solid var(--nfx-line);border-radius:2px;transition:border-color .12s,color .12s,background .12s}
.chip:hover{border-color:var(--nfx-fg);color:var(--nfx-strong)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-on);border-color:var(--accent)}
.chip.all[aria-pressed="true"]{background:var(--nfx-fg);color:var(--nfx-on-fg);border-color:var(--nfx-fg)}
select{height:32px;padding:0 10px;font:inherit;font-size:13px;color:var(--text);background:transparent;border:1px solid var(--border);border-radius:8px;cursor:pointer}
select:hover{border-color:var(--border-strong)}
select option{background:var(--surface);color:var(--text)}
.search-wrap{position:relative;flex:0 1 280px;min-width:150px;margin-left:auto;background:var(--nfx-search) padding-box;border:2px solid transparent;border-radius:10px;transition:background-color .12s,border-color .12s}
.search-wrap:focus-within{background-color:var(--nfx-search-focus);border-color:var(--nfx-search-ring)}
.search-wrap svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--nfx-search-icon);pointer-events:none}
.search-wrap:focus-within svg{color:var(--nfx-strong)}
.search{width:100%;height:40px;padding:0 14px 0 42px;font:inherit;font-size:15px;color:var(--text);background:transparent;border:0;outline:0}
.shown-count{font-size:12px;font-weight:600;color:var(--text-muted);white-space:nowrap;font-variant-numeric:tabular-nums}
@media (max-width:600px){.search-wrap{flex:1 1 100%;margin-left:0}}

.tier-block{margin-bottom:22px;position:relative;border-radius:12px;padding:2px 6px 8px}
.tier-heading{display:flex;align-items:center;gap:10px;margin:16px 0 10px;padding-bottom:8px;font-size:14px;font-weight:600;border-bottom:1px solid color-mix(in oklab,var(--tier-color) 30%,transparent)}
.tier-pill{display:inline-flex;align-items:center;justify-content:center;padding:4px 16px;border-radius:6px;color:#0e1116;background:var(--tier-color);font-size:16px;font-weight:700;text-shadow:0 1px 0 rgba(255,255,255,.25);letter-spacing:.3px}
.tier-count{color:#9aa0a6;font-size:12px;font-weight:400}
.tier-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
@media (max-width:600px){.tier-grid{grid-template-columns:1fr}}

/* NEW: item tile. Built from chip-bg surface, 8px radius, 2px tier frame (champ tile border), copied hover/selected states. */
.item{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-width:0;padding:8px 10px 8px 8px;text-align:left;font:inherit;color:inherit;cursor:pointer;
  background:var(--chip-bg);border:1px solid transparent;border-radius:8px;transition:transform .08s,box-shadow .08s,border-color .08s}
@media (hover:hover){.item:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 45%,transparent);box-shadow:0 8px 24px -8px rgba(192,132,252,.35)}}
.item[aria-expanded="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:-2px;transform:none;box-shadow:none}
.icon{grid-row:1/3;display:grid;place-items:center;width:44px;height:44px;border-radius:8px;background:var(--augment-icon-surface);border:2px solid var(--tier-color)}
.icon img{width:34px;height:34px;object-fit:contain}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .p{font-size:15px;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums lining-nums}
.item .p small,.unit{font-size:11px;font-weight:600;color:var(--text-muted);margin-left:2px}
.item .p.none{color:var(--text-dim)}
.item .m{grid-column:2/4;font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{padding:40px;text-align:center;color:var(--text-muted)}

.detail-host{grid-column:1/-1;min-width:0}
.detail{margin:6px 0 4px;border-radius:10px;padding:16px 18px 18px;position:relative;animation:slideDown .18s ease-out;background:var(--surface-raised);border:1px solid var(--border-strong)}
@keyframes slideDown{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.detail{animation:none}.item{transition:none}}
.inline-detail-close{position:absolute;top:-12px;right:-12px;z-index:2;display:grid;place-items:center;width:26px;height:26px;padding:0;background:var(--surface-raised);border:1px solid var(--border-strong);border-radius:50%;color:var(--text-muted);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.inline-detail-close::before{content:"";position:absolute;inset:-8px;border-radius:50%}
.inline-detail-close:hover{background:var(--surface-2);color:var(--text)}
@media (max-width:600px){.inline-detail-close{right:-6px}}
.detail-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:4px;margin-bottom:14px;min-width:0}
.detail-avatar{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;flex:0 0 auto;background:var(--augment-icon-surface);box-shadow:inset 0 0 0 1px var(--border-strong)}
.detail-avatar img{width:34px;height:34px;object-fit:contain}
.inline-champ-id{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.inline-champ-title{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px}
.cname{margin:0;font-size:18px;font-weight:600;line-height:1.25}
.detail-role-tag{display:inline-flex;align-items:center;font-size:12px;font-weight:500;line-height:1;color:var(--text-muted);white-space:nowrap}
.inline-champ-stats{font-size:13px;font-variant-numeric:tabular-nums;color:var(--text-muted)}
.inline-champ-stats b{font-weight:600;color:var(--text)}
.inline-detail-actions{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:4px;margin-left:auto;align-self:flex-start;margin-top:-6px}
.inline-detail-actions a{display:inline-flex;align-items:center;gap:4px;min-height:32px;padding:0 8px;border-radius:6px;color:var(--accent-soft);font-size:13px;text-decoration:none;white-space:nowrap}
.inline-detail-actions a:hover{background:var(--surface-2)}
.inline-detail-actions svg{width:13px;height:13px}
@media (pointer:coarse){.inline-detail-actions a{min-height:40px}}
@media (max-width:600px){.inline-detail-actions{margin:0;justify-content:flex-start;width:100%}}
.detail-cols{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:18px}
.detail-col h3{margin:0 0 8px;font-size:13px;font-weight:600;letter-spacing:.3px}
@media (max-width:900px){.detail-cols{grid-template-columns:1fr 1fr}.detail-cols .fx{grid-column:1/-1}}
@media (max-width:600px){.detail-cols{grid-template-columns:1fr;gap:14px}}
.section-meta{color:#9aa0a6;font-size:11px;font-weight:400;font-family:var(--font-caption)}
.mods{display:grid;gap:6px}
.mods div{display:grid;grid-template-columns:56px 1fr;gap:10px}
.mods .l{font-size:12px;font-weight:600;color:var(--text-muted)}
.mods .t{white-space:pre-line}
.loc{display:grid;gap:10px}
.loc .k{font-size:12px;color:var(--text-muted)}
.loc .z{font-weight:600}
.loc .en{font-size:12px;color:var(--text-dim)}
table{width:100%;border-collapse:collapse;font-size:13px}
td{padding:5px 4px;border-bottom:1px solid var(--border);vertical-align:middle}
td.l{color:var(--text-muted);font-size:12px;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.v{font-weight:700;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.v small{font-size:11px;font-weight:600;color:var(--text-muted);margin-left:2px}
td.c{color:var(--text-muted);font-size:12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.a{text-align:right;white-space:nowrap} td.a a{color:var(--accent-soft);font-size:12px;text-decoration:none}
details{margin-top:6px;font-size:12px;color:var(--text-muted)} summary{cursor:pointer}
.note{font-size:12px;color:var(--text-muted);margin-top:6px}
footer{margin-top:32px;font-size:12px;color:var(--text-muted);display:grid;gap:4px}
footer a{color:var(--text-muted)}
</style>

<div class="wrap">
<header>
  <h1>Wickerman 臟器</h1>
  <div class="subtitle">3.30 Covens · 依 poe.ninja 最高價分級 · 更新於 <span id="snap"></span> · 1 div ≈ <span id="div"></span> c</div>
</header>

<div class="bar">
  <div class="chips" id="fType" role="group" aria-label="來源類型"></div>
  <div class="chips" id="fSlot" role="group" aria-label="部位"></div>
  <select id="fAct" aria-label="章節"></select>
  <span class="shown-count" id="count"></span>
  <label class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input class="search" type="search" id="q" placeholder="名稱、地圖、Boss、詞綴" aria-label="搜尋"></label>
</div>

<main id="list"></main>

<footer>
  <div>Fate 強化區域 Boss 後擊殺才掉。Greater 只從地圖版 Boss 掉；頭目類需要對應的 Grim Fate。</div>
  <div>資料：<a href="https://poedb.tw/tw/Viscera" target="_blank" rel="noopener">poedb.tw</a> · <a href="https://poe.ninja/poe1/economy/covens/viscera" target="_blank" rel="noopener">poe.ninja</a> · <a href="https://maxroll.gg/poe/resources/wickerman-viscera-guide" target="_blank" rel="noopener">Maxroll</a></div>
</footer>
</div>

<script>
const DATA=/*DATA*/null;
const DIV=DATA.div;
const SLOT={"Head":"頭部","Upper Limb":"上肢","Torso":"軀幹","Lower Limb":"下肢"};
const TAG={boss:"頭目",map:"地圖王",act:"章節王"};
const TIERS=[["S",5*DIV,"≥ 5 div","T1"],["A",DIV,"1–5 div","T2"],["B",50,"50c – 1 div","T3"],["C",15,"15 – 50c","T4"],["D",-1,"< 15c 或無報價","T5"]];
const COLOR=Object.fromEntries(TIERS.map(t=>[t[0],`var(--${t[3]})`]));
const GRIM=Object.fromEntries(DATA.grim.filter(g=>g[2]).map(g=>[g[2],g[0]]));
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const price=c=>!c?"—":c>=DIV?`${(c/DIV).toFixed(c/DIV>=10?0:1)}<small>div</small>`:`${c>=10?Math.round(c):c.toFixed(1)}<small>c</small>`;
const trade=(host,lg,type)=>`https://${host}/trade/search/${encodeURIComponent(lg)}?q=${encodeURIComponent(JSON.stringify({query:{type}}))}`;
const NINJA="https://poe.ninja/poe1/economy/covens/viscera";
const EXT=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6"/><path d="M20 4 10 14"/><path d="M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/></svg>`;
const items=DATA.items.map(x=>{
  const all=Object.values(x.tiers).flat();
  const max=Math.max(0,...all.map(r=>r[1]));
  const camp=x.drops.filter(d=>d.act), map=x.drops.filter(d=>!d.act);
  const type=x.group==="pin"?"boss":map.length?"map":"act";
  let place;
  if(type==="map")place=map[0].zone;
  else if(type==="boss"){const d=map[0]||camp[0];place=d.zone||d.boss;}
  else place=`Act ${camp[0].act} ${camp[0].zone}`;
  const act=x.act ?? camp[0]?.act ?? null;
  const tier=TIERS.find(t=>max>=t[1])[0];
  const hay=[x.en,x.tw,...x.drops.flatMap(d=>[d.boss,d.bossEn,d.zone,d.zoneEn]),...x.mods.map(m=>m[1]),...x.modsEn.map(m=>m[1])].join(" ").toLowerCase();
  return {...x,max,camp,map,type,place,act,tier,hay};
});
document.getElementById("snap").textContent=new Date(DATA.snap).toLocaleString("zh-TW",{timeZone:"Asia/Taipei",month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
document.getElementById("div").textContent=DIV;

const st={type:"all",slot:"all",act:"all",q:""};
try{Object.assign(st,JSON.parse(localStorage.getItem("vt")||"{}"),{q:""});}catch(e){}
const save=()=>{try{localStorage.setItem("vt",JSON.stringify({type:st.type,slot:st.slot,act:st.act}))}catch(e){}};
function chips(id,list,key){const el=document.getElementById(id);
  el.innerHTML=list.map(([v,t])=>`<button class="chip${v==="all"?" all":""}" type="button" data-v="${v}">${t}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;st[key]=b.dataset.v;save();sync();render();};}
chips("fType",[["all","全部"],["boss","頭目"],["map","地圖王"],["act","章節王"]],"type");
chips("fSlot",[["all","全部部位"],...Object.entries(SLOT)],"slot");
const fAct=document.getElementById("fAct");
fAct.innerHTML=`<option value="all">全部章節</option>`+Array.from({length:10},(_,i)=>`<option value="${i+1}">Act ${i+1}</option>`).join("");
fAct.onchange=()=>{st.act=fAct.value;save();render();};
document.getElementById("q").oninput=e=>{st.q=e.target.value.trim().toLowerCase();render();};
function sync(){
  document.querySelectorAll("#fType .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.type));
  document.querySelectorAll("#fSlot .chip").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===st.slot));
  fAct.value=st.act;}
const pass=x=>(st.type==="all"||x.type===st.type)&&(st.slot==="all"||x.slot===st.slot)&&(st.act==="all"||x.act===+st.act)&&(!st.q||st.q.split(/\s+/).every(w=>x.hay.includes(w)));

function tile(x){
  return `<button class="item" type="button" data-id="${x.id}" aria-expanded="false" aria-controls="det" title="${esc(x.en)}">
  <span class="icon"><img src="${x.img}" alt=""></span>
  <span class="n">${esc(x.tw)}</span><span class="p${x.max?"":" none"}">${price(x.max)}</span>
  <span class="m">${TAG[x.type]} · ${esc(x.place)}</span></button>`;}
let openId=null;
function render(){
  const list=items.filter(pass);
  document.getElementById("count").textContent=`${list.length} / ${items.length}`;
  const html=TIERS.map(([L,,r])=>{const t=list.filter(x=>x.tier===L).sort((a,b)=>b.max-a.max);
    if(!t.length)return "";
    return `<section class="tier-block" style="--tier-color:${COLOR[L]}"><h2 class="tier-heading"><span class="tier-pill">${L}</span><span class="tier-count">${esc(r)} · ${t.length} 件</span></h2><div class="tier-grid">${t.map(tile).join("")}</div></section>`}).join("");
  document.getElementById("list").innerHTML=html||`<div class="empty">沒有符合的臟器</div>`;
  if(openId!=null){const t=document.querySelector(`.item[data-id="${openId}"]`);t?show(t,false):(openId=null);}}

const LAB=l=>({Low:"Lesser",Med:"一般",High:"Greater",Queen:"巫后",Uber:"Uber","":"固定"}[l] ?? (/^\d$/.test(l)?"變體 "+l:l.replace("High","Greater")));
const TL={Lesser:"Lesser",Normal:"一般",Greater:"Greater"};
function detail(x){
  const mods=x.mods.map(m=>`<div><span class="l">${esc(LAB(m[0]))}</span><span class="t">${esc(m[1])}</span></div>`).join("")||`<div class="note">poedb 尚無詞綴資料</div>`;
  const where=d=>`<div><div class="k">${d.act?"Act "+d.act:x.type==="boss"?"頭目戰":"地圖"}</div>
    <div class="z">${esc(d.zone||d.boss)}${d.zone?` <span class="detail-role-tag">· ${esc(d.boss)}</span>`:""}</div>
    <div class="en">${esc(d.zoneEn||d.bossEn)}${d.zoneEn?" — "+esc(d.bossEn):""}</div></div>`;
  const loc=[...x.map,...x.camp].map(where).join("")+(GRIM[x.en]?`<div><div class="k">需要 Grim Fate</div><div class="z">${esc(GRIM[x.en])}</div></div>`:"");
  const rows=["Lesser","Normal","Greater"].filter(k=>x.tiers[k]).flatMap(k=>x.tiers[k].map(r=>[TL[k],...r]));
  const tiers=Object.keys(x.tiers).length;
  const multi=rows.length>tiers;
  const row=r=>`<tr><td class="l" title="${esc(r[1])}">${esc(multi&&r[1]?r[1]:r[0])}</td><td class="v">${price(r[2])}</td><td class="c">${r[3]} 掛</td><td class="a">${r[5]?`<a href="${NINJA}/${encodeURIComponent(r[5])}" target="_blank" rel="noopener">ninja</a>`:""}</td></tr>`;
  const sorted=multi?[...rows].sort((a,b)=>b[2]-a[2]):rows;
  const table=sorted.length?`<table>${sorted.slice(0,6).map(row).join("")}</table>`+(sorted.length>6?`<details><summary>其餘 ${sorted.length-6} 種</summary><table>${sorted.slice(6).map(row).join("")}</table></details>`:""):`<div class="note">poe.ninja 目前無報價</div>`;
  const rolls=!x.mods.length&&sorted.length>3;
  const fx=rolls?`<div class="note" style="margin:0 0 6px">隨機一條詞綴，共 ${sorted.length} 種</div>${table}`:`<div class="mods">${mods}</div>`;
  const prices=rolls?`<div class="loc"><div><div class="k">價格區間</div><div class="z num">${price(Math.min(...sorted.map(r=>r[2]).filter(Boolean)))} – ${price(sorted[0][2])}</div></div></div>`:table;
  const links=[
    x.ti?`<a href="${trade("www.pathofexile.com","Covens",x.en)}" target="_blank" rel="noopener">國際服 Trade ${EXT}</a>`:"",
    x.tt?`<a href="${trade("pathofexile.tw","巫影密會",x.tt)}" target="_blank" rel="noopener">台服 Trade ${EXT}</a>`:"",
    `<a href="https://poedb.tw/tw/${encodeURIComponent(x.slug)}" target="_blank" rel="noopener">poedb ${EXT}</a>`].join("");
  return `<div class="detail detail-inline">
  <button class="inline-detail-close" type="button" aria-label="收合"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  <div class="detail-head"><span class="detail-avatar"><img src="${x.img}" alt=""></span>
    <div class="inline-champ-id"><div class="inline-champ-title"><h3 class="cname">${esc(x.tw)}</h3><span class="detail-role-tag">${TAG[x.type]} · ${SLOT[x.slot]||"—"}</span></div>
    <div class="inline-champ-stats"><b>${price(x.max).replace("<small>","<span class=unit>").replace("</small>","</span>")}</b> · ${esc(x.en)}</div></div>
    <div class="inline-detail-actions">${links}</div></div>
  <div class="detail-cols">
    <div class="detail-col fx"><h3>效果</h3>${fx}</div>
    <div class="detail-col"><h3>掉落位置</h3><div class="loc">${loc}</div></div>
    <div class="detail-col"><h3>價格 <span class="section-meta">poe.ninja</span></h3>${prices}${x.ti&&tiers>1?`<div class="note">Trade 不分等級，看詞綴分辨。</div>`:""}</div>
  </div></div>`;}

const host=document.createElement("div");host.className="detail-host";host.id="det";host.setAttribute("role","region");
function show(t,scroll=true){
  const x=items.find(i=>i.id===+t.dataset.id);openId=x.id;
  document.querySelectorAll('.item[aria-expanded="true"]').forEach(b=>b.setAttribute("aria-expanded","false"));
  t.setAttribute("aria-expanded","true");
  host.innerHTML=detail(x);host.setAttribute("aria-label",x.tw);
  host.remove();
  const top=t.offsetTop;let last=t;
  for(const s of t.parentNode.querySelectorAll(".item"))if(s.offsetTop===top)last=s;
  last.after(host);
  if(scroll)host.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});}
function hide(){const t=document.querySelector(`.item[data-id="${openId}"]`);openId=null;host.remove();if(t){t.setAttribute("aria-expanded","false");t.focus();}}
document.getElementById("list").onclick=e=>{
  if(e.target.closest(".inline-detail-close")){hide();return;}
  const t=e.target.closest(".item");if(!t)return;
  +t.dataset.id===openId?hide():show(t);};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&openId!=null)hide();});
let rz;addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(openId!=null){const t=document.querySelector(`.item[data-id="${openId}"]`);t&&show(t,false);}},120);});
sync();render();
</script>
